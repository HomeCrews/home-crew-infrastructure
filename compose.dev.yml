      # platform-specific tree in your checkout, and would collide with any
      # install you run outside the container.
      - webapp_node_modules:/app/node_modules
      - ./webapp-dev.sh:/webapp-dev.sh:ro
    environment:
      WEBAPP_POLL_INTERVAL: ${WEBAPP_POLL_INTERVAL:-2000}

volumes:
  webapp_node_modules:
