# Dev override: every service runs from your checkout, hot reloading.
#
# Used together with docker-compose.yml, which ./dev does for you:
#
#     docker compose -f docker-compose.yml -f compose.dev.yml up -d
#
# LOCAL IMAGES ONLY. Every service here is rebuilt from Dockerfile.dev in this
# repository and tagged homecrew-dev-runtime:jdk25, which replaces the
# mthanuj/homecrew-*:dev image from the base file. Nothing is ever pulled from
# Docker Hub, so a stale published tag cannot quietly replace the code you are
# editing. One image serves all twelve: it contains a JDK and nothing else,
# because the application arrives on a bind mount.
#
# Never used by the deploy. .github/workflows/deploy.yml runs plain
# `docker compose` with no -f flags and only scps docker-compose.yml to the
# host, so this file cannot reach production even by accident.
#
# Each service gets a debugger on its own port, 5005 upwards in the order
# below. DevTools restarts happen inside the same JVM, so an attached debugger
# survives them.

services:
  service-discovery:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: homecrew-dev-runtime:jdk25
    pull_policy: never
    entrypoint: ["/bin/sh", "/dev-reload.sh"]
    working_dir: /app
    mem_limit: ${DEV_SERVICE_MEM:-1g}
    volumes:
      - ../home-crew-service-discovery:/app
      - ${HOME}/.m2:/root/.m2
      - ./dev-reload.sh:/dev-reload.sh:ro
    environment:
      # Emptied, not tuned. The production value is -Xmx128m and
      # JAVA_TOOL_OPTIONS applies to EVERY JVM in the container, so it would
      # cap Maven at 128m too and make the compile loop crawl.
      JAVA_TOOL_OPTIONS: ""
      MAVEN_OPTS: "-Xmx256m"
      # Only the forked application JVM gets the debug agent. In
      # JAVA_TOOL_OPTIONS, Maven and every compile-loop JVM would try to bind
      # this port as well, every two seconds.
      DEV_JVM_ARGS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2s
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1s
      # Passed through explicitly. .env drives compose SUBSTITUTION, not
      # container environment, so dev-reload.sh would never see it otherwise -
      # it would silently fall back to its own default and the knob in .env
      # would look broken rather than absent.
      DEV_RELOAD_INTERVAL: ${DEV_RELOAD_INTERVAL:-2}
    ports:
      - "5005:5005"
    healthcheck:
      start_period: 240s
      retries: 40

