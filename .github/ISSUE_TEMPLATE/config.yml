# Reserved filename with its own schema: only blank_issues_enabled and
# contact_links belong here. Adding name: or body: makes GitHub try to render
# this as a form and the whole chooser breaks.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/HomeCrews/home-crew-infrastructure/blob/dev/.github/SECURITY.md
    about: Report privately through the Security tab. Do not open an issue.

  - name: Question or setup help
    url: https://github.com/HomeCrews/home-crew-infrastructure/blob/dev/.github/SUPPORT.md
    about: Read SUPPORT.md first - most setup problems are answered there.

  - name: Compose, ports or deployment problem
    url: https://github.com/HomeCrews/home-crew-infrastructure/issues/new/choose
    about: Infrastructure problems belong in the infrastructure repository.

  - name: A shared configuration value is wrong
    url: https://github.com/HomeCrews/home-crew-config
    about: Shared config lives in home-crew-config, not in the services.
