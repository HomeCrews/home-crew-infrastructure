name: Deploy to Hetzner Dev

on:
  repository_dispatch:
    types:
      - service-image-updated

concurrency:
  group: hetzner-dev-deployment
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Deploy ${{ github.event.client_payload.service }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4

      - name: Validate deployment payload
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          IMAGE: ${{ github.event.client_payload.image }}
          TAG: ${{ github.event.client_payload.tag }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          echo "Service: $SERVICE"
          echo "Image:   $IMAGE"
          echo "Tag:     $TAG"
          echo "SHA:     $SHA"

          case "$SERVICE" in
            user-service|auth-service|admin-service|booking-service|worker-service|notification-service|payment-service|xp-service|assignment-service|api-gateway|config-server|service-discovery)
              ;;
            *)
              echo "ERROR: Unsupported service: $SERVICE"
              exit 1
              ;;
          esac

          if [ "$TAG" != "dev" ]; then
            echo "ERROR: Only dev deployments are allowed."
            exit 1
          fi

          case "$IMAGE" in
            mthanuj/homecrew-*)
              ;;
            *)
              echo "ERROR: Invalid Docker image: $IMAGE"
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/homecrew
          chmod 600 ~/.ssh/homecrew

          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Write host environment file
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          CONFIG_GIT_USERNAME: ${{ secrets.CONFIG_GIT_USERNAME }}
          CONFIG_GIT_TOKEN: ${{ secrets.CONFIG_GIT_TOKEN }}
        run: |
          set -euo pipefail

          # /opt/homecrew/.env used to be hand-placed, undocumented and
          # unrotatable. docker compose reads it for variable substitution, so
          # without it POSTGRES_PASSWORD is unset and `docker compose config`
          # now fails - which is the point.
          #
          # Piped over stdin, never passed as an ssh argument: argv is visible
          # in `ps` on the remote host for as long as the command runs. Not
          # scp'd either - that would leave the file on the runner disk where
          # every later step can read it.
          #
          # printf per line rather than a heredoc: an unquoted heredoc would
          # mangle a value containing a backslash, and a compose .env cannot
          # represent an embedded newline anyway.
          #
          # Written to .env.new and renamed, because mv on one filesystem is
          # atomic - a `docker compose up` racing this step reads either the old
          # file or the new one, never a truncated one.
          {
            printf 'POSTGRES_USER=%s\n'       "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n'   "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n'         "$POSTGRES_DB"
            printf 'CONFIG_GIT_USERNAME=%s\n' "$CONFIG_GIT_USERNAME"
            printf 'CONFIG_GIT_TOKEN=%s\n'    "$CONFIG_GIT_TOKEN"
          } | ssh \
            -i ~/.ssh/homecrew \
            "$HETZNER_USER@$HETZNER_HOST" \
            "umask 077 \
             && mkdir -p /opt/homecrew \
             && cat > /opt/homecrew/.env.new \
             && chmod 600 /opt/homecrew/.env.new \
             && mv /opt/homecrew/.env.new /opt/homecrew/.env"

          # Never cat the file back. Name, mode and size are enough to prove it
          # landed; GitHub secrets are the source of truth for the contents.
          ssh \
            -i ~/.ssh/homecrew \
            "$HETZNER_USER@$HETZNER_HOST" \
            "stat -c '%n mode=%a size=%s' /opt/homecrew/.env"

      - name: Sync infrastructure configuration
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail

          echo "Syncing infrastructure configuration..."

          test -f "$GITHUB_WORKSPACE/docker-compose.yml"

          ssh \
            -i ~/.ssh/homecrew \
            "$HETZNER_USER@$HETZNER_HOST" \
            "mkdir -p /opt/homecrew"

          scp \
            -i ~/.ssh/homecrew \
            "$GITHUB_WORKSPACE/docker-compose.yml" \
            "$HETZNER_USER@$HETZNER_HOST:/opt/homecrew/docker-compose.yml"

          echo "Infrastructure configuration synced."

      - name: Deploy service
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          SERVICE: ${{ github.event.client_payload.service }}
          IMAGE: ${{ github.event.client_payload.image }}
          TAG: ${{ github.event.client_payload.tag }}
          SHA: ${{ github.event.client_payload.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Deploying $SERVICE"
          echo "Image: $IMAGE:$TAG"
          echo "Commit: $SHA"

          printf '%s' "$DOCKERHUB_TOKEN" | ssh \
            -i ~/.ssh/homecrew \
            "$HETZNER_USER@$HETZNER_HOST" \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

          ssh \
            -i ~/.ssh/homecrew \
            "$HETZNER_USER@$HETZNER_HOST" \
            "cd /opt/homecrew && \
             docker compose config --quiet && \
             docker compose pull '$SERVICE' && \
             docker compose up -d '$SERVICE'"

      - name: Verify deployment
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          SERVICE: ${{ github.event.client_payload.service }}
        run: |
          set -euo pipefail

          echo "Verifying $SERVICE..."

          ssh \
            -i ~/.ssh/homecrew \
            "$HETZNER_USER@$HETZNER_HOST" \
            "cd /opt/homecrew && \
             docker compose ps '$SERVICE' && \
             docker inspect 'homecrew-$SERVICE' \
               --format 'Image={{.Config.Image}} Status={{.State.Status}}'"

      - name: Deployment summary
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          IMAGE: ${{ github.event.client_payload.image }}
          TAG: ${{ github.event.client_payload.tag }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          echo "========================================"
          echo "Deployment successful"
          echo "========================================"
          echo "Service : $SERVICE"
          echo "Image   : $IMAGE:$TAG"
          echo "SHA     : $SHA"
          echo "Target  : Hetzner Dev"
          echo "========================================"
