# Three anchors, not one, so a credential reaches only the containers that use
# it. The single anchor this replaced put DB_PASSWORD into service-discovery,
# config-server, api-gateway, notification-service and assignment-service -
# five containers with no datasource - which is the same objection already
# written against webapp further down this file.
#
# YAML merges a sequence of maps, so a service composes what it needs:
#   <<: *spring-base                                       not a config client
#   <<: [*spring-base, *config-client]                     config, no database
#   <<: [*spring-base, *config-client, *datasource-client] the seven JPA services
#
# An explicit key on the service always beats the merge, which is how
# service-discovery and config-server raise JAVA_TOOL_OPTIONS.

# Every Spring service, without exception.
x-spring-base: &spring-base
  # container = the compose topology (service names instead of localhost).
  # Overridable so the deployed host can layer on top: deploy.yml writes
  # SPRING_PROFILES_ACTIVE=container,deploy into /opt/homecrew/.env, adding the
  # `deploy` profile that carries the encrypted secrets. Nothing local sets it,
  # so a laptop's config-server never needs the production ENCRYPT_KEY.
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-container}

  JAVA_TOOL_OPTIONS: "-Xms32m -Xmx128m -XX:+UseSerialGC"

# The ten services that import their configuration from config-server.
# service-discovery is NOT one - it has no spring.config.import - and
# config-server is the server, not a client.
x-config-client: &config-client
  # Resolves ${CONFIG_SERVER_URI:...} in each service's single
  # spring.config.import line. Services declare one import, not one per
  # profile, so this is what points it inside the network.
  CONFIG_SERVER_URI: http://config-server:8888

  # ConfigServerConfigDataLoader throws when failFast || !optional, so this -
  # not the optional: prefix - is the switch. A deployed service that cannot
  # reach config-server must refuse to start rather than come up on whatever
  # its jar happens to contain.
  SPRING_CLOUD_CONFIG_FAIL_FAST: "true"

  # config-server requires HTTP basic now that it decrypts {cipher} values.
  # Same ${VAR:-default} shape as the database credentials: the local default
  # is public and only unlocks a config-server on your own machine.
  CONFIG_CLIENT_USERNAME: ${CONFIG_CLIENT_USERNAME:-configclient}
  CONFIG_CLIENT_PASSWORD: ${CONFIG_CLIENT_PASSWORD:-localdev}

# Only the seven services that actually own a DataSource.
x-datasource-client: &datasource-client
  # Resolve the ${DB_USERNAME}/${DB_PASSWORD} placeholders that config-server
  # serves without substituting. .env drives compose SUBSTITUTION, not container
  # environment, so these have to be passed through explicitly or the services
  # would fall back to the defaults in home-crew-config and fail to authenticate
  # against a postgres with a real password.
  #
  # Derived from POSTGRES_* rather than set independently, so the database and
  # its clients cannot drift apart. That derivation is also why these two are
  # deliberately absent from .env.example.
  DB_USERNAME: ${POSTGRES_USER:-homecrew}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-homecrew}

x-common-service: &common-service
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *common-service
    image: postgres:18
    container_name: homecrew-postgres

    mem_limit: 256m

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homecrew}
      # :? rather than :- on purpose. This is the one value in the file whose
      # absence must be loud: `docker compose config --quiet` in deploy.yml
      # passed happily with no .env at all, because a bare ${VAR} substitutes
      # to empty with only a warning. Now it exits non-zero.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?unset - is /opt/homecrew/.env present and readable?}
      POSTGRES_DB: ${POSTGRES_DB:-homecrew}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecrew -d homecrew"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - homecrew

  kafka:
    <<: *common-service
    image: apache/kafka:4.1.0
    container_name: homecrew-kafka

    # 512m, not 384m. The broker alone is -Xmx256m plus metaspace, code cache,
    # direct buffers and thread stacks, which lands around 350m RSS - so at
    # 384m there was no room for a second process of any kind, and the
    # healthcheck below is a second process. Budget note: this raises the sum
    # of all mem_limits in this file to 3200m, so confirm the host still has
    # headroom before assuming this is free.
    mem_limit: 512m

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      # KAFKA_HEAP_OPTS is overridden for the probe, and only for the probe.
      # kafka-broker-api-versions.sh runs through bin/kafka-run-class.sh, which
      # reads the SAME KAFKA_HEAP_OPTS set above - so every interval spawned a
      # second JVM asking for -Xms128m inside a cgroup the broker had already
      # nearly filled. Whoever lost that is decided by the kernel OOM killer,
      # and it picks the largest RSS, which is the broker.
      #
      # 20s timeout because this is a JVM CLI, not a ping. Cold start plus an
      # AdminClient bootstrap is routinely 5-10s on a small host, so the old 5s
      # killed the probe mid-handshake. Ten kills in a row (retries x interval)
      # flipped the container to unhealthy and one later success flipped it
      # back, so `depends_on: service_healthy` passed or failed depending on
      # when the deploy happened to sample it - a deploy that fails only
      # sometimes, on an unchanged commit.
      #
      # 30s interval rather than 10s, but NOT for the reason first written here.
      # Docker runs a container's healthchecks sequentially - the next probe
      # starts `interval` after the previous one FINISHES - so two probes can
      # never overlap and the original rationale was simply wrong. The real
      # reason stands: at 10s this container span a fresh JVM roughly every 15s
      # inside a memory-capped cgroup, and that churn is what starved the broker.
      # At 30s it is about every 35s.
      #
      # start_interval applies ONLY during start_period, and it is what stops
      # `interval` from also being a floor on how fast this can go healthy. With
      # interval alone the first probe lands at 30s, so kafka could not report
      # healthy sooner even when the broker was up at 18s - and service-discovery,
      # config-server and all ten clients queue behind it, so that floor was
      # costing the whole deploy.
      #
      # Needs Docker Engine >= 25.0 and Compose >= 2.20. If the host is older,
      # `docker compose config` rejects the key outright and every deploy fails
      # at its validation gate - so verify before relying on it.
      start_interval: 5s
      test:
        [
          "CMD-SHELL",
          "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 40s

    networks:
      - homecrew

  service-discovery:
    <<: *common-service
    image: mthanuj/homecrew-service-discovery:dev
    container_name: homecrew-service-discovery

    mem_limit: 256m

    ports:
      - "8761:8761"

    environment:
      <<: *spring-base
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:+UseSerialGC"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8761/actuator/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

    networks:
      - homecrew

  config-server:
    <<: *common-service
    image: mthanuj/homecrew-config-server:dev
    container_name: homecrew-config-server

    # 320m, up from 256m. This container gained spring-boot-starter-security, the
    # encryptor and RequiredSecrets, and JGit holds a clone of home-crew-config -
    # all inside what was a 192m heap. GC pressure there shows up as a slow
    # /actuator/health, which is the one thing that must stay fast.
    mem_limit: 320m

    ports:
      - "8888:8888"

    environment:
      <<: *spring-base
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:+UseSerialGC"
      # ${VAR?...} not ${VAR:-} and not ${VAR:?}. The bare ? errors when the
      # variable is UNSET but allows it to be empty - so it cannot be forgotten
      # silently, and it can still be deliberately blank if home-crew-config is
      # ever made public. With :- a missing .env produced a config-server that
      # started, registered no CredentialsProvider, and failed the clone with
      # "Authentication is required but no CredentialsProvider has been
      # registered" - which reads like a broken dependency, not a missing token.
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME?unset - home-crew-config is private; set it in /opt/homecrew/.env}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN?unset - home-crew-config is private; set it in /opt/homecrew/.env}

      # ${VAR?...} like the git credentials above, not ${VAR:-}. There is no
      # sane fallback for an encryption key: a default would mean every
      # {cipher} value in home-crew-config decrypts to garbage, and the
      # services would start with nonsense credentials rather than not start.
      ENCRYPT_KEY: ${ENCRYPT_KEY?unset - config-server cannot decrypt {cipher} values without it; set it in /opt/homecrew/.env}
      # The password clients present. Defaulted to match the anchor above so a
      # local stack works from .env.example alone.
      CONFIG_CLIENT_PASSWORD: ${CONFIG_CLIENT_PASSWORD:-localdev}

    depends_on:
      service-discovery:
        condition: service_healthy

    healthcheck:
      # Unauthenticated on purpose, and the reason SecurityConfig permits exactly
      # this path. Behind basic auth this curl is a 401, config-server never
      # reports healthy, and all ten `depends_on: service_healthy` clients refuse
      # to start - a total outage whose cause looks nothing like a security
      # setting.
      #
      # TIMEOUT MUST EXCEED spring.cloud.config.server.git.timeout (10s).
      # ConfigServerHealthIndicator resolves a real Environment, so before
      # refresh-rate was raised this probe could trigger a git fetch - and a 3s
      # curl timeout against an operation allowed 10s to connect meant the probe
      # lost a race it was never able to win. Roughly one deploy in five flipped
      # this container to unhealthy as a result.
      #
      # interval is the GAP between probes, not a cadence - Docker starts the next
      # probe `interval` after the previous one finishes - so 15s + a 12s worst
      # case is a ~27s cycle. start_interval keeps startup detection fast anyway.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8888/actuator/health || exit 1",
        ]
      start_interval: 3s
      interval: 15s
      timeout: 12s
      retries: 6
      start_period: 60s

    networks:
      - homecrew

  api-gateway:
    <<: *common-service
    image: mthanuj/homecrew-api-gateway:dev
    container_name: homecrew-api-gateway

    mem_limit: 192m

    ports:
      - "8080:8080"

    environment:
      <<: [*spring-base, *config-client]

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy

    networks:
      - homecrew

  auth-service:
    <<: *common-service
    image: mthanuj/homecrew-auth-service:dev
    container_name: homecrew-auth-service

    mem_limit: 192m

    ports:
      - "8082:8082"

    environment:
      <<: [*spring-base, *config-client, *datasource-client]

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy

    networks:
      - homecrew

  user-service:
    <<: *common-service
    image: mthanuj/homecrew-user-service:dev
    container_name: homecrew-user-service

    mem_limit: 192m

    ports:
      - "8081:8081"

    environment:
      <<: [*spring-base, *config-client, *datasource-client]

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy

    networks:
      - homecrew

  admin-service:
    <<: *common-service
    image: mthanuj/homecrew-admin-service:dev
    container_name: homecrew-admin-service

    mem_limit: 192m

    ports:
      - "8083:8083"

    environment:
      <<: [*spring-base, *config-client, *datasource-client]

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - homecrew

  booking-service:
    <<: *common-service
    image: mthanuj/homecrew-booking-service:dev
    container_name: homecrew-booking-service

    mem_limit: 192m

    ports:
      - "8084:8084"

    environment:
      <<: [*spring-base, *config-client, *datasource-client]

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - homecrew

  worker-service:
    <<: *common-service
    image: mthanuj/homecrew-worker-service:dev
    container_name: homecrew-worker-service

    mem_limit: 192m

    ports:
      - "8085:8085"

    environment:
      <<: [*spring-base, *config-client, *datasource-client]

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - homecrew

  notification-service:
    <<: *common-service
    image: mthanuj/homecrew-notification-service:dev
    container_name: homecrew-notification-service

    mem_limit: 192m

    ports:
      - "8086:8086"

    environment:
      <<: [*spring-base, *config-client]

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - homecrew

  payment-service:
    <<: *common-service
    image: mthanuj/homecrew-payment-service:dev
    container_name: homecrew-payment-service

    mem_limit: 192m

    ports:
      - "8087:8087"

    environment:
      <<: [*spring-base, *config-client, *datasource-client]

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - homecrew

  xp-service:
    <<: *common-service
    image: mthanuj/homecrew-xp-service:dev
    container_name: homecrew-xp-service

    mem_limit: 192m

    ports:
      - "8088:8088"

    environment:
      <<: [*spring-base, *config-client, *datasource-client]

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - homecrew

  assignment-service:
    <<: *common-service
    image: mthanuj/homecrew-assignment-service:dev
    container_name: homecrew-assignment-service

    mem_limit: 192m

    ports:
      - "8089:8089"

    environment:
      <<: [*spring-base, *config-client]

    # No postgres dependency: this service has no spring-boot-starter-data-jpa
    # and no datasource, so it was waiting on a database it never opens - and
    # there is no homecrew_assignment in postgres/init/01-create-databases.sql
    # for it to open either.
    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - homecrew

  webapp:
    <<: *common-service
    image: mthanuj/homecrew-webapp:dev
    container_name: homecrew-webapp

    # nginx serving static files, not a JVM. 64m is generous for it.
    mem_limit: 64m

    # 4200:80 rather than 80:80. 4200 is what Angular's dev server uses, so the
    # URL is the same whether you are running the built image or the dev
    # container, and neither needs root to bind a privileged port.
    ports:
      - "4200:80"

    # Deliberately inherits NONE of the spring anchors. This is not a Spring
    # application: it has no config-server client, no Eureka registration and
    # no datasource. SPRING_CLOUD_CONFIG_FAIL_FAST would bind to nothing, and
    # inheriting DB_PASSWORD would put a credential in a container that serves
    # its whole filesystem to the browser.

    # service_started, not service_healthy: api-gateway has no healthcheck, and
    # the browser - not this container - is what calls the gateway, so nothing
    # here breaks if the gateway is slow. This only expresses intent about
    # startup order.
    depends_on:
      api-gateway:
        condition: service_started

    networks:
      - homecrew

networks:
  homecrew:
    name: homecrew

volumes:
  postgres_data:
  kafka_data:
