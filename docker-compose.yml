    networks:
      - homecrew

  notification-service:
    <<: *common-service
    image: mthanuj/homecrew-notification-service:dev
    container_name: homecrew-notification-service

    ports:
      - "8086:8086"

    environment:
      <<: *spring-environment

    depends_on:
