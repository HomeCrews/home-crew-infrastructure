x-spring-environment: &spring-environment
  SPRING_PROFILES_ACTIVE: docker
  JAVA_TOOL_OPTIONS: "-Xms32m -Xmx128m -XX:+UseSerialGC"

x-common-service: &common-service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *common-service
    image: postgres:18
    container_name: homecrew-postgres

    environment:
      POSTGRES_USER: homecrew
      POSTGRES_PASSWORD: homecrew
      POSTGRES_DB: homecrew

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecrew -d homecrew"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - homecrew

  kafka:
    <<: *common-service
    image: apache/kafka:4.1.0
    container_name: homecrew-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Low-memory development server
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - homecrew

  service-discovery:
    <<: *common-service
    image: mthanuj/homecrew-service-discovery:dev
    container_name: homecrew-service-discovery

    ports:
      - "8761:8761"

    environment:
      <<: *spring-environment
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8761/actuator/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

    networks:
      - homecrew

  config-server:
    <<: *common-service
    image: mthanuj/homecrew-config-server:dev
    container_name: homecrew-config-server

    ports:
      - "8888:8888"

    environment:
      <<: *spring-environment
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN}

    depends_on:
      service-discovery:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8888/actuator/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

    networks:
      - homecrew

  api-gateway:
    <<: *common-service
    image: mthanuj/homecrew-api-gateway:dev
    container_name: homecrew-api-gateway

    ports:
      - "8080:8080"

    environment:
      <<: *spring-environment

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy

    networks:
      - homecrew

  auth-service:
    <<: *common-service
    image: mthanuj/homecrew-auth-service:dev
    container_name: homecrew-auth-service

    ports:
      - "8082:8082"

    environment:
      <<: *spring-environment

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy

    networks:
      - homecrew

  user-service:
    <<: *common-service
    image: mthanuj/homecrew-user-service:dev
    container_name: homecrew-user-service

    ports:
      - "8081:8081"

    environment:
