  assignment-service:
    <<: *common-service
    image: mthanuj/homecrew-assignment-service:dev
    container_name: homecrew-assignment-service

    ports:
      - "8089:8089"

    environment:
      <<: *spring-environment

    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - homecrew

networks:
  homecrew:
    name: homecrew

volumes:
  postgres_data:
  kafka_data:
