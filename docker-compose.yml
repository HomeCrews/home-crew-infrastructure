      kafka:
        condition: service_healthy

    networks:
      - homecrew

  booking-service:
    <<: *common-service
    image: mthanuj/homecrew-booking-service:dev
    container_name: homecrew-booking-service

    ports:
      - "8084:8084"

    environment:
      <<: *spring-environment

    depends_on:
